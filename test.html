<!DOCTYPE html>
<html>
<head>
  <title>Test Agent</title>
  <style>
    body { font-family: Arial; padding: 20px; text-align: center; }
    button { padding: 15px 30px; font-size: 16px; background: #22c55e; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #16a34a; }
    #result { margin-top: 20px; padding: 20px; background: #f0f0f0; border-radius: 5px; min-height: 50px; }
  </style>
</head>
<body>
  <h1>🧪 ProSites Agent Test</h1>
  <button onclick="testAgent()">Send Test Message to Slack</button>
  <div id="result">Waiting...</div>

  <script>
   <script>
  async function testAgent() {
    const result = document.getElementById('result');
    result.innerHTML = 'Testing...';
    
    try {
      const response = await fetch('/api/slack', {
        method: 'POST',
      });

      const data = await response.json();

      if (data.success) {
        result.innerHTML = '✅ Message sent to Slack! Check #sales-bot channel now.';
      } else {
        result.innerHTML = '❌ Error: ' + data.error;
      }
    } catch (error) {
      result.innerHTML = '❌ Error: ' + error.message;
    }
  }
</script>
  </script>
</body>
</html>
